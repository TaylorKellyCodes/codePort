<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "{{ client.domain }}/#organization",
      "name": "{{ client.name }}",
      "url": "{{ client.domain }}",
      "logo": {
        "@type": "ImageObject",
        "url": "{{ client.domain }}/assets/images/portfolio/logoSidelarge.png",
        "width": 1200,
        "height": 627
      },
      "telephone": "{{ client.phoneForTel }}",
      "email": "{{ client.email }}",
      "founder": {"@id": "{{ client.domain }}/#person"},
      "foundingLocation": {"@type": "Place", "name": "Raleigh, NC"},
      "areaServed": {"@type": "AdministrativeArea", "name": "Research Triangle, North Carolina"},
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "{{ client.address.city }}",
        "addressRegion": "{{ client.address.state }}",
        "addressCountry": "{{ client.address.country }}"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "telephone": "{{ client.phoneForTel }}",
        "email": "{{ client.email }}",
        "areaServed": "US-NC",
        "availableLanguage": "English"
      },
      "sameAs": [
        "https://www.facebook.com/TriangleWebDesignRaleigh/",
        "{{ client.socials.google }}",
        "https://www.linkedin.com/in/taylor-kelly-codes/",
        "https://www.linkedin.com/company/triangle-web-design-raleigh/"
      ]
    },
    {
      "@type": "Person",
      "@id": "{{ client.domain }}/#person",
      "name": "Taylor Kelly",
      "url": "{{ client.domain }}/about/",
      "jobTitle": "Founder, Web Designer & Local SEO Specialist",
      "worksFor": {"@id": "{{ client.domain }}/#organization"},
      "sameAs": ["https://www.linkedin.com/in/taylor-kelly-codes/"]
    },
    {
      "@type": "ProfessionalService",
      "@id": "{{ client.domain }}/#localbusiness",
      "name": "{{ client.name }}",
      "url": "{{ client.domain }}",
      "parentOrganization": {"@id": "{{ client.domain }}/#organization"},
      "founder": {"@id": "{{ client.domain }}/#person"},
      "image": "{{ client.domain }}/assets/images/portfolio/logoSidelarge.png",
      "logo": "{{ client.domain }}/assets/images/portfolio/logoSidelarge.png",
      "telephone": "{{ client.phoneForTel }}",
      "email": "{{ client.email }}",
      "priceRange": "$$",
      "description": "Service-area web design and local SEO for small businesses across Raleigh, Durham, Chapel Hill, Cary and the wider NC Triangle. Hand-coded websites from $0 down, $150/month. Available 24/7.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "{{ client.address.city }}",
        "addressRegion": "{{ client.address.state }}",
        "addressCountry": "{{ client.address.country }}"
      },
      "areaServed": [
        {"@type": "City", "name": "Raleigh"},
        {"@type": "City", "name": "Durham"},
        {"@type": "City", "name": "Chapel Hill"},
        {"@type": "City", "name": "Cary"},
        {"@type": "City", "name": "Apex"},
        {"@type": "City", "name": "Wake Forest"},
        {"@type": "City", "name": "Garner"},
        {"@type": "City", "name": "Morrisville"},
        {"@type": "City", "name": "Mebane"},
        {"@type": "City", "name": "Carrboro"},
        {"@type": "City", "name": "Hillsborough"},
        {"@type": "City", "name": "Pittsboro"}
      ],
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
        "opens": "00:00",
        "closes": "23:59"
      },
      "sameAs": [
        "https://www.facebook.com/TriangleWebDesignRaleigh/",
        "{{ client.socials.google }}",
        "https://www.linkedin.com/in/taylor-kelly-codes/",
        "https://www.linkedin.com/company/triangle-web-design-raleigh/"
      ],
      "serviceType": ["Web Design", "Local SEO", "Website Maintenance"],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "@id": "{{ client.domain }}/pricing/#offercatalog",
        "name": "Web Design & SEO plans",
        "itemListElement": [
          {
            "@type": "Offer",
            "name": "Lump Sum",
            "description": "One-time hand-coded website build. You own the code.",
            "priceSpecification": {"@type": "PriceSpecification", "price": "3600", "priceCurrency": "USD"},
            "itemOffered": {"@type": "Service", "name": "Custom hand-coded website (one-time build)"}
          },
          {
            "@type": "Offer",
            "name": "Monthly",
            "description": "Managed hand-coded website: hosting, unlimited edits, 24/7 support and lifetime updates. $0 down.",
            "priceSpecification": {"@type": "UnitPriceSpecification", "price": "150", "priceCurrency": "USD", "unitCode": "MON"},
            "itemOffered": {"@type": "Service", "name": "Managed website subscription"}
          },
          {
            "@type": "Offer",
            "name": "SEO Growth",
            "description": "Everything in Monthly plus local SEO: city service pages, Google Business Profile management, reviews, backlinks. $0 down.",
            "priceSpecification": {"@type": "UnitPriceSpecification", "price": "500", "priceCurrency": "USD", "unitCode": "MON"},
            "itemOffered": {"@type": "Service", "name": "Managed website + local SEO"}
          }
        ]
      }
    },
    {
      "@type": "WebSite",
      "@id": "{{ client.domain }}/#website",
      "url": "{{ client.domain }}",
      "name": "{{ client.name }}",
      "inLanguage": "en-US",
      "publisher": {"@id": "{{ client.domain }}/#organization"}
    }
  ]
}
</script>

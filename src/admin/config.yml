# 1. THE BACKEND (From DecapBridge)
backend:
  name: git-gateway
  repo: TaylorKellyCodes/codePort
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/7d50f43f-d5fe-4b03-beb2-117d47557cfd/pkce
  auth_token_endpoint: /sites/7d50f43f-d5fe-4b03-beb2-117d47557cfd/token
  gateway_url: https://gateway.decapbridge.com

# 2. COMMIT MESSAGES
commit_messages:
  create: "Create {{collection}} “{{slug}}” - {{author-name}} via DecapBridge"
  update: "Update {{collection}} “{{slug}}” - {{author-name}} via DecapBridge"
  delete: "Delete {{collection}} “{{slug}}” - {{author-name}} via DecapBridge"
  uploadMedia: "Upload “{{path}}” - {{author-name}} via DecapBridge"
  deleteMedia: "Delete “{{path}}” - {{author-name}} via DecapBridge"
  openAuthoring: "Message {{message}} - {{author-name}} via DecapBridge"

# 3. GLOBAL SETTINGS
local_backend: false
logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://trianglewebdesign.com

# 4. AUTH & MEDIA
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

media_folder: "src/assets/images/blog"
public_folder: "/assets/images/blog"

# 5. COLLECTIONS (Indentation fixed)
collections:
  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "URL Slug", name: "url", widget: "string", hint: "blog/blog-post" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Tags", name: "tags", widget: "list", default: ["post"] }
      - { label: "Featured Image", name: "image", widget: "image" }
      - { label: "Image Caption", name: "imageAlt", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }
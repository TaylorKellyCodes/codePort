[build]
  publish = "public/"
  command = "npm run build"

[[plugins]]
package = "netlify-plugin-cache"

  [plugins.inputs]
  paths = [
    "public/assets/images", # Processed images - adjust to match your outputDir
    ".cache" # Remote Assets
  ]
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Report-Only first: watch the browser console for violations for ~2 weeks,
    # then promote to Content-Security-Policy (remove "-Report-Only").
    # img-src covers the CodeStitch DigitalOcean Spaces icon CDN (see NEEDS-YOUR-INPUT.md
    # about self-hosting those SVGs, which would let img-src drop to 'self' data:).
    Content-Security-Policy-Report-Only = "default-src 'self'; img-src 'self' data: https://csimg.nyc3.cdn.digitaloceanspaces.com https://csimg.nyc3.digitaloceanspaces.com; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

